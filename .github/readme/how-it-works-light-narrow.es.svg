<svg xmlns="http://www.w3.org/2000/svg" width="520" height="425" viewBox="0 0 520 425" role="img" aria-label="Busca por nombre, uso o extensión.: Filtra por categoría, compara hasta tres a la vez, o haz un test corto que te recomienda uno según lo que quieras construir, tu nivel y lo que valoras. Mueve los mandos.: Cada uno corriendo a tamaño real con sus mandos a la vista. Copia el código.: Mueve los controles y copia el código con tus valores ya puestos."><g transform="translate(8 8) scale(2)"><g fill="none" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="80" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Busca por nombre, uso o</text><text x="80" y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">extensión.</text><text x="80" y="102" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Filtra por categoría.</text><path d="M32 68 V145" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 137 L32 145 L38 137" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 157) scale(2)"><path fill="none" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M10 5H3m9 14H3M14 3v4m2 10v4m5-9h-9m9 7h-5m5-14h-7m-6 5v4m0-2H3"/></g><text x="80" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Mueve los mandos.</text><text x="80" y="217" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Cada uno corriendo a tamaño real con</text><text x="80" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">sus mandos a la vista.</text><path d="M32 217 V289" stroke="#d1d9e0" stroke-width="2" fill="none"/><path d="M26 281 L32 289 L38 281" stroke="#d1d9e0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(8 301) scale(2)"><g fill="none" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g></g><text x="80" y="327" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#1f2328">Copia el código.</text><text x="80" y="361" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">Mueve los controles y copia el</text><text x="80" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="21" fill="#59636e">código con tus valores ya puestos.</text></svg>