<svg xmlns="http://www.w3.org/2000/svg" width="960" height="195" viewBox="0 0 960 195" role="img" aria-label="Busca por nombre, uso o extensión.: Filtra por categoría, compara hasta tres a la vez, o haz un test corto que te recomienda uno según lo que quieras construir, tu nivel y lo que valoras. Mueve los mandos.: Cada uno corriendo a tamaño real con sus mandos a la vista. Copia el código.: Mueve los controles y copia el código con tus valores ya puestos."><g transform="translate(134 8) scale(2.1667)"><g fill="none" stroke="#467bee" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="160" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Busca por nombre, uso o</text><text x="160" y="130" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">extensión.</text><text x="160" y="164" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Filtra por categoría.</text><path d="M206 34 H432" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M425 28 L434 34 L425 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(454 8) scale(2.1667)"><path fill="none" stroke="#467bee" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" d="M10 5H3m9 14H3M14 3v4m2 10v4m5-9h-9m9 7h-5m5-14h-7m-6 5v4m0-2H3"/></g><text x="480" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Mueve los mandos.</text><text x="480" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Cada uno corriendo a tamaño real</text><text x="480" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">con sus mandos a la vista.</text><path d="M526 34 H752" stroke="#3d444d" stroke-width="2" fill="none"/><path d="M745 28 L754 34 L745 40" stroke="#3d444d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(774 8) scale(2.1667)"><g fill="none" stroke="#467bee" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g></g><text x="800" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#f0f6fc">Copia el código.</text><text x="800" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">Mueve los controles y copia el</text><text x="800" y="159" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="17" fill="#9198a1">código con tus valores ya puestos.</text></svg>